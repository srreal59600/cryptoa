# https://docs.devin.ai/onboard-devin/environment/blueprint-reference
# WhaleRadar Devin environment: Go listener + Node dashboard/bot, Docker Compose runtime.
initialize:
  - uses: github.com/actions/setup-go@v5
    with:
      go-version: "1.23.4"
      cache-dependency-path: "apps/listener/go.sum"
  - uses: github.com/actions/setup-node@v4
    with:
      node-version: "20"
      cache: "npm"
      cache-dependency-path: |
        apps/dashboard/package-lock.json
        apps/bot/package-lock.json

maintenance:
  - run: (cd apps/listener && go mod download)
  - run: (cd apps/dashboard && npm install)
  - run: (cd apps/bot && npm install)

knowledge:
  - name: lint
    contents: |
      (cd apps/listener && gofmt -l . && go vet ./...)
      (cd apps/dashboard && npx tsc --noEmit && npm run lint)
      (cd apps/bot && npm run typecheck && npm run lint)
  - name: test
    contents: |
      (cd apps/listener && go test ./...)
      (cd apps/dashboard && npm run lint)
      (cd apps/bot && npm run lint)
  - name: build
    contents: |
      docker compose up -d --build
  - name: run-live
    contents: |
      Copy .env.example to .env, fill TELEGRAM_BOT_TOKEN, RPC URLs and payment address, then:
      docker compose --profile live --profile bot up -d --build
